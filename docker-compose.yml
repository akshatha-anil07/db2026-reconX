  # TODO(ADV148): add backend service
  #   - build: ./backend
  #   - depends_on: postgres (service_healthy), kafka (service_healthy)
  #   - environment: SPRING_PROFILES_ACTIVE, POSTGRES_*, KAFKA_BOOTSTRAP, JWT_SECRET
  #   - healthcheck: wget --spider http://localhost:8080/api/actuator/health

  # TODO(ADV148): add frontend service
  #   - build: ./frontend
  #   - depends_on: backend (service_healthy)

  # TODO(ADV149): add prometheus service (prom/prometheus:v2.54.1)
  #   - mount ./monitoring/prometheus/prometheus.yml and alerts.yml

  # TODO(ADV150): add grafana service (grafana/grafana:11.2.0)
  #   - mount ./monitoring/grafana/provisioning
  #   - GF_SECURITY_ADMIN_USER/PASSWORD: admin/admin

networks:
  reconx:

volumes:
  postgres_data:
  grafana_data:
