services:

  postgres:
    image: postgres:16-alpine
    container_name: reconx-postgres
    environment:
      POSTGRES_DB:       reconx
      POSTGRES_USER:     reconx_user
      POSTGRES_PASSWORD: reconx_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # TODO(ADV152): add healthcheck for postgres
    networks: [reconx]

  # TODO(ADV148): add zookeeper service (confluentinc/cp-zookeeper:7.6.0)

  # TODO(ADV148): add kafka service (confluentinc/cp-kafka:7.6.0)
